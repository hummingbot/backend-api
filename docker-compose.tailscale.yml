# Tailscale sidecar overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# network_mode: host lets the Tailscale daemon create a real tailscale0 interface
# on the host. hummingbot-api's port 8000 is bound to 127.0.0.1 by default (see
# API_BIND in docker-compose.yml / .env), so TS_SERVE_CONFIG below — which
# forwards the tailnet IP's :8000 to 127.0.0.1:8000 via tailscale-serve.json,
# reachable directly because this sidecar shares the host's network namespace —
# is what's meant to make port 8000 reachable on the tailnet without ever
# putting the API on a public interface.
#
# `make deploy` does not itself invoke `tailscale serve`; TS_SERVE_CONFIG applies
# the same config declaratively when the sidecar starts, and both the tailnet IP
# and MagicDNS name have been verified to reach a loopback-bound port through it.
# If you'd rather not depend on the sidecar applying serve config at all — e.g.
# a deploy that skips this overlay — set API_BIND=<tailscale-ip> in .env instead.
#
# The base docker-compose.yml emqx-bridge network is unaffected — emqx and
# postgres still communicate with hummingbot-api normally via that bridge.

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: hummingbot-tailscale
    network_mode: host
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel mode by default -- but `make deploy` sets TS_USERSPACE=true when
      # this host already runs its own tailscaled, because two kernel-mode
      # daemons in one network namespace cannot both own tailscale0 and the
      # loser dies silently inside a container that still reports "running".
      # Netstack coexists with a kernel-mode daemon unconditionally and can
      # still serve a loopback-bound port, which is all this sidecar does.
      - TS_USERSPACE=${TS_USERSPACE:-false}
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-hummingbot-api}
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

volumes:
  tailscale_state:
