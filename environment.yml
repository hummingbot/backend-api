name: hummingbot-api
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - boto3
  - libcxx                
  - libta-lib>=0.6.4
  - python-dotenv
  - pandas>=2.3.2
  - numba>=0.61.2
  - numpy>=2.2.6
  - pandas-ta>=0.4.71b
  - ta-lib>=0.6.4
  - tqdm>=4.67.1
  - psutil>=5.9.0
  - docker-py
  - pip
  - pip:
      # Unpinned deliberately: the core changes this API reads (ExecutorInfo's
      # volume_traded_quote, and the order-executor custom_info fields) are not in a
      # PyPI release yet, so there is no version to pin to. That makes install order
      # load-bearing — merge the hummingbot PR and let it ship before an image built
      # from this file is expected to record volume. utils/core_compatibility.py
      # refuses to start against a core that is missing them, so a wrong install is a
      # startup error rather than a deployment that books zeros in silence.
      - hummingbot
      - geckoterminal-py>=0.3.1
      - msgpack>=1.0.5
      - flake8
      - isort
      - pytest
      - pytest-asyncio
      - pre-commit
      - logfire
      - logfire[fastapi]
      - logfire[system-metrics]
      - aiomqtt>=2.0.0
      - sqlalchemy>=2.0.0
      - asyncpg
      - psycopg2-binary
      - greenlet
      - pydantic-settings
